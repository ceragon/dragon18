<!--
PROTOTYPE, throwaway. 问题:降题十八掌 Demo 的长相与动效是什么样?
三个结构不同的方向,同一份故事线与演示数据,1920×1080 舞台自动缩放。
  ?variant=A  墨卷:一幅横向展开的水墨长卷,镜头在画上平移
  ?variant=B  擂台:暗场聚光,十八掌位圆环常驻,镜头推拉
  ?variant=C  图解:亮色手册,左侧六段导轨,把题面拆成可移动的条件片
其他参数:&beat=0..7 直接跳到某一拍;&auto=1 自动演示。键盘:1/2/3 换方向,←/→ 前后拍,空格 自动/手动。
招式体系仍待孩子确认,所有文案均为演示数据或草稿,不是最终录屏内容。
-->

<script>
/* ================= shared story + engine ================= */
const SEGS=['使命','硬件示意','见题','拆题','练习','速查卡'];
const SEG=[0,1,2,2,3,4,4,5], NB=8;
const CH={
 3:{opts:['潜龙勿用','见龙在田','暂无对应的掌'],ok:1,
    fb:['再看一遍:按字面展开,会缺一个量吗?200 元、八折、20 元都写明了,不缺。','见龙在田。题面把条件和顺序都写明了,按写明的顺序展开就行。','这道题能用已有的掌,不需要「暂无对应的掌」。']},

    fb:['不是计算。180×0.8=144 这步算术是对的。','不是方法。他没有改走别的做法,只是把顺序弄反了。','审题。题面写的是「先打八折,再降 20 元」,他读成了先降 20 元再打八折。','不是概念。「八折」就是乘 0.8,这个意思他用对了。']},

    fb:['对。250×0.8=200,200−40=160,顺序和题面一致。','这是上一题的老毛病:把「先、再」读反了。','漏掉了「再降 40 元」这个已经写明的条件。']},
 6:{input:true,ok:'19',unit:'米',

};

function fillInteractive(){
  qa('[data-opts]',stage).forEach(c=>{const b=+c.dataset.opts,ch=CH[b];
    c.innerHTML=ch.opts.map((o,i)=>`<button class="opt" data-b="${b}" data-i="${i}"><i class="k">${'ABCD'[i]}</i><span>${o}</span></button>`).join('')});

const VARS={A:{name:'墨卷',build:buildA,css:'vA'},B:{name:'擂台',build:buildB,css:'vB'},C:{name:'图解',build:buildC,css:'vC'}};
function mount(v,b=0,runAutoNow=false){
 token++;auto=false;V=v;cancelAnimationFrame(embRAF);done={};
 stage.className='stage '+VARS[v].css; stage.dataset.auto='0'; stage.innerHTML=VARS[v].build();
 fillInteractive(); if(v==='B')embers();
 const u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);
 go(b); requestAnimationFrame(()=>go(b)); if(runAutoNow)runAuto();
}
function fit(){const s=Math.min(innerWidth/1920,(innerHeight-56)/1080);q('#scaler').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
q('#dots').innerHTML=Array.from({length:NB},(_,i)=>`<i title="${i}"></i>`).join('');
qa('#dots i').forEach((d,i)=>d.onclick=()=>{stopAuto();go(i)});
const cyc=d=>{const k=Object.keys(VARS);mount(k[(k.indexOf(V)+d+k.length)%k.length],0)};
q('#vPrev').onclick=()=>cyc(-1);q('#vNext').onclick=()=>cyc(1);
q('#bPrev').onclick=()=>{stopAuto();go(beat-1)};
q('#bNext').onclick=()=>{if(!gated()){stopAuto();go(beat+1)}};
q('#autoBtn').onclick=()=>auto?stopAuto():runAuto();
addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea,[contenteditable]'))return;
 if(e.key==='ArrowRight')q('#bNext').click();else if(e.key==='ArrowLeft')q('#bPrev').click();
 else if(e.key===' '){e.preventDefault();q('#autoBtn').click()}
 else if('123'.includes(e.key))mount('ABC'[+e.key-1],0);
});
const P=new URLSearchParams(location.search);
window.story={go,pick,submit,runAuto,mount,get done(){return done}};
mount((P.get('variant')||'A').toUpperCase(),+(P.get('beat')||0),P.get('auto')==='1');
</script>
