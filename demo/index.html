<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>见题拆题之降题十八掌 · 软件 Demo</title>
<!--
拍引擎与舞台骨架(issue #38):片头卡 + 六段导轨 + 拍引擎 + 键盘推进 + ?beat=N 直达
+ 1920×1080 等比缩放纯舞台。拍 1 使命开场(#39)、拍 2–3 硬件示意(#40)已补全;拍 4–13 为骨架占位。
URL 参数:?beat=N 任意拍直达;record=1 保留(指针不进画面);auto/notes 参数保留给后续票。
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;overflow:hidden}
#vp{position:fixed;inset:0;overflow:hidden}
#scaler{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:center center}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--navy);
 --bg:#f4f1ea;--card:#fffdf8;--navy:#14213d;--mut:#6b7385;--line:#d9d3c5;--coral:#ef5b3f;--teal:#0f8b8d;--sun:#ffc43d;
 --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
 --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
 font-family:var(--sans)}
.stage[data-record="1"],.stage[data-record="1"] *{cursor:none}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
 background-size:60px 60px;mask-image:radial-gradient(ellipse at 60% 50%,#000 20%,transparent 80%)}

/* ---------- 六段导轨(常驻) ---------- */
.rail{position:absolute;left:0;top:0;bottom:0;width:380px;background:var(--navy);color:#e9e4d6;padding:80px 50px;z-index:10;display:flex;flex-direction:column}
.rail .logo{font:900 44px var(--serif);letter-spacing:.14em;line-height:1.3;color:#fff}
.rail .logo small{display:block;font:600 16px var(--sans);letter-spacing:.3em;color:#8d97b3;margin-top:10px}
.rail ol{list-style:none;margin-top:70px;position:relative}
.rail ol::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:3px;background:#2d3b61}
.rail .prog{position:absolute;left:21px;top:20px;width:3px;height:0;background:var(--sun);transition:height 1.2s cubic-bezier(.7,0,.2,1)}
.rail li{position:relative;height:86px;display:flex;align-items:flex-start;gap:26px;font-size:30px;color:#8d97b3;transition:color .5s}
.rail li i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);border:3px solid #2d3b61;display:grid;place-items:center;font:700 18px var(--sans);font-style:normal;z-index:1;transition:all .6s}
.rail li span{padding-top:5px}
.rail li.past{color:#e9e4d6}
.rail li.past i{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.rail li.on{color:#fff;font-weight:700}
.rail li.on i{background:#fff;border-color:var(--sun);color:var(--navy);transform:scale(1.2);box-shadow:0 0 0 8px #ffc43d44}
.mini18{margin-top:auto;display:grid;grid-template-columns:repeat(9,22px);gap:8px}
.mini18 i{width:22px;height:22px;border-radius:6px;border:2px dashed #8d97b355;display:grid;place-items:center;font:700 12px var(--serif);font-style:normal;color:transparent}
.mini18 i.lit{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.tent{margin-top:34px;font:600 16px var(--sans);color:#8d97b3;letter-spacing:.12em;line-height:1.8;word-break:keep-all;white-space:pre-line}

/* ---------- 主区:每拍一景 ---------- */
.main{position:absolute;left:380px;top:0;right:0;bottom:0}
.notebar{position:absolute;left:110px;right:110px;top:44px;min-height:30px;font:600 22px var(--sans);color:var(--mut);letter-spacing:.04em;z-index:5}
.sc{position:absolute;inset:0;padding:120px 110px 90px;opacity:0;visibility:hidden;transform:translateY(40px);
 transition:opacity .5s,transform .8s cubic-bezier(.2,.8,.2,1),visibility 0s .6s}
.sc.in{opacity:1;visibility:visible;transform:none;
 transition:opacity .7s .35s,transform .9s cubic-bezier(.2,.8,.2,1) .35s}
.r{opacity:0;transform:translateY(26px);transition:opacity .6s var(--d,0s),transform .8s cubic-bezier(.2,1.1,.3,1) var(--d,0s)}
.sc.in .r{opacity:1;transform:none}
.num-big{position:absolute;right:90px;top:20px;font:900 380px var(--serif);color:#14213d0d;letter-spacing:-.04em;pointer-events:none}
.kick{font:700 22px var(--sans);letter-spacing:.3em;color:var(--coral);margin-bottom:14px}

/* ---------- 片头卡(拍 0) ---------- */
.sc.title{display:grid;place-items:center}
.tc{text-align:center}
.tc-name{font:900 96px var(--serif);letter-spacing:.08em;line-height:1.2}
.tc-who{font-size:44px;font-weight:700;letter-spacing:.2em;margin-top:36px}
.tc-decl{display:inline-block;margin-top:64px;font:700 20px var(--sans);letter-spacing:.18em;color:var(--mut);border:1.5px dashed var(--mut);border-radius:999px;padding:10px 28px}
.tc-attr{margin-top:46px;font-size:22px;color:var(--mut);letter-spacing:.06em}

/* ---------- 使命开场拍(拍 1) ---------- */
.ms-line{font:900 66px var(--serif);letter-spacing:.04em;line-height:1.4;max-width:1300px;margin-top:56px}
.ms-line .hi{-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .06em;
 background-image:linear-gradient(var(--sun),var(--sun));background-repeat:no-repeat;background-position:0 100%;background-size:0% .58em}
.sc.in .ms-line .hi{animation:hi .9s cubic-bezier(.7,0,.2,1) .7s forwards}
@keyframes hi{to{background-size:100% .58em}}
.draft{display:inline-block;margin-top:34px;font:700 20px var(--sans);letter-spacing:.18em;color:var(--mut);border:1.5px dashed var(--mut);border-radius:999px;padding:8px 26px}
.p18{display:grid;grid-template-columns:repeat(9,1fr);gap:16px;margin-top:64px}
.p18 i{height:104px;border-radius:14px;border:2.5px dashed #6b738566;display:grid;place-items:center;font:700 26px var(--serif);font-style:normal;color:var(--mut);letter-spacing:.1em;
 opacity:0;transform:translateY(22px) scale(.92);transition:opacity .5s var(--d,0s),transform .7s cubic-bezier(.2,1.2,.3,1) var(--d,0s)}
.sc.in .p18 i{opacity:1;transform:none}
.p18 i.lit{background:var(--navy);border-style:solid;border-color:var(--navy);color:#f4f1ea;font-size:26px;letter-spacing:.05em;white-space:nowrap}
.p18-note{margin-top:32px;font:600 22px var(--sans);color:var(--mut);letter-spacing:.1em}

/* ---------- 硬件示意拍(拍 2–3) ---------- */
.hw{display:flex;align-items:flex-start;gap:60px;margin-top:64px}
.hw-fig{flex:none;width:720px}
.k10{display:block;width:720px;height:auto}
.k10 text{font-family:var(--sans)}
.k10 .bd{fill:var(--card);stroke:var(--navy);stroke-width:5;stroke-dasharray:18 10}
.k10 .part{fill:none;stroke:var(--mut);stroke-width:4}
.k10 .scr{fill:#ece6d8;stroke:var(--navy);stroke-width:4;stroke-dasharray:12 8}
.k10 .dot{fill:var(--mut)}
.k10 .bl{font-size:30px;font-weight:700;fill:var(--mut)}
.k10 .co{opacity:0;transition:opacity .45s}
.k10 .co-line{stroke:var(--navy);stroke-width:3}
.k10 .co-dot{fill:var(--sun);stroke:var(--navy);stroke-width:2}
.k10 .co-txt{font-size:26px;font-weight:700;fill:var(--navy)}
.k10 .co-txt .u{font-size:23px;font-weight:600;fill:var(--mut)}
.k10 .hl .part{transition:stroke .4s,fill .4s}
.k10 .hl .dot,.k10 .hl .bl{transition:fill .4s}
.sc.in.cont .k10 .co{opacity:1;transition:opacity .6s var(--d,0s)}
.sc.in.cont .k10 .hl .part{stroke:var(--sun);fill:#ffc43d1f;transition:stroke .5s var(--d,0s),fill .5s var(--d,0s)}
.sc.in.cont .k10 .hl .dot{fill:var(--navy);transition:fill .5s var(--d,0s)}
.sc.in.cont .k10 .hl .bl{fill:var(--navy);transition:fill .5s var(--d,0s)}
.k10-cap{width:400px;text-align:center;margin-top:4px;font:600 20px var(--sans);color:var(--mut);letter-spacing:.16em}
.hw-side{flex:1;min-width:0;padding-top:30px}
.own-h{font-size:30px;font-weight:700;line-height:1.5}
.own-l{list-style:none;margin-top:22px}
.own-l li{display:flex;gap:16px;font-size:26px;line-height:1.75;margin-top:16px}
.own-l .no{flex:none;font-weight:700;color:var(--coral)}

/* ---------- 骨架占位拍(后续票补全) ---------- */
.ph-h{font:900 72px var(--serif);letter-spacing:.06em;margin-top:110px}
.ph-p{font-size:28px;color:var(--mut);margin-top:26px}
</style>
</head>
<body>
<div id="vp"><div id="scaler"><div id="stage" class="stage">
  <aside class="rail">
    <div class="logo">降题<br>十八掌<small>见题拆题</small></div>
    <ol><li class="prog" aria-hidden="true"></li>
      <li data-seg="0"><i>1</i><span>使命开场</span></li>
      <li data-seg="1"><i>2</i><span>硬件示意</span></li>
      <li data-seg="2"><i>3</i><span>见题</span></li>
      <li data-seg="3"><i>4</i><span>拆题</span></li>
      <li data-seg="4"><i>5</i><span>练习</span></li>
      <li data-seg="5"><i>6</i><span>招式速查卡</span></li>
    </ol>
    <div class="mini18" aria-hidden="true"></div>
    <div class="tent" id="tent"></div>
  </aside>
  <div class="main">
    <header class="notebar" id="notebar"></header>
    <section class="sc title" data-beat="0">
      <div class="tc">
        <h1 class="tc-name r" style="--d:.3s">见题拆题之降题十八掌</h1>
        <div class="tc-who r" style="--d:.8s">李赫愃·海淀实验</div>
        <div class="r" style="--d:1.3s"><span class="tc-decl">演示数据 · 预置回复 · 硬件示意</span></div>
        <div class="tc-attr r" style="--d:1.8s">演示 Demo 由家长协助制作，参赛程序由李赫愃本人编写</div>
      </div>
    </section>
    <section class="sc" data-beat="1">
      <div class="num-big">01</div>
      <div class="kick r" style="--d:.15s">使命开场</div>
      <h2 class="ms-line r" style="--d:.45s"><span class="hi">一错，破一类——看懂错在哪，带走一类题的破解思路。</span></h2>
      <div class="r" style="--d:.8s"><span class="draft">草稿 · 待确认</span></div>
      <div class="p18" id="p18-1" aria-label="十八掌位"></div>
      <p class="p18-note r" style="--d:2.7s">十八个掌位 · 两掌已立 · 其余十六位待立</p>
    </section>
  </div>
</div></div></div>
<script>
const SEGMENTS = ["使命开场","硬件示意","见题","拆题","练习","招式速查卡"];
const TENT_STD = "招式体系暂定 · 孩子未确认 · 演示数据";
const TENT_QA  = "问辩备查 · 不在正式演示流程内";
// 硬件示意拍的公共标注(#40):如实句措辞随真实现状,板到位开始制作再改「制作中」。
const HW = {seg:1,tag:"硬件示意",note:"这是设计示意：行空板尚未实物制作"};
// 拍序:seg = 点亮段(null = 导轨外);gate 作答拍在后续票接上选项后开启;
// tag = 该拍专属常驻小标(加在标准如实句前一行);note 说明条与 notes 解说词草稿逐拍留槽位,文案未定。
const BEATS = [
  {seg:null},                          // 0  片头卡(导轨外)
  {seg:0},                             // 1  使命开场
  HW,                                  // 2  硬件示意:整板轮廓+归属清单
  HW,                                  // 3  硬件示意:同屏续拍,三条引出线依次高亮
  {seg:2},{seg:2},                     // 4–5 见题(5 为作答拍)
  {seg:3},{seg:3},{seg:3},             // 6–8 拆题(6 为作答拍)
  {seg:4},{seg:4},                     // 9–10 练习(9、10 为作答拍)
  {seg:5},                             // 11 招式速查卡
  {seg:null,tent:TENT_QA},             // 12 问辩附页(导轨外)
  {seg:null,tent:TENT_QA},             // 13 问辩附页(导轨外)
];
const NB = BEATS.length;
const segLast = SEGMENTS.map((_, s) => Math.max(...BEATS.map((b, i) => (b.seg === s ? i : -1))));

const stage = document.getElementById("stage");
const scaler = document.getElementById("scaler");
const tent = document.getElementById("tent");
const notebar = document.getElementById("notebar");
const prog = document.querySelector(".rail .prog");
const railOl = document.querySelector(".rail ol");
const segLis = [...document.querySelectorAll(".rail li[data-seg]")];
const main = document.querySelector(".main");

// 硬件示意拍(#40):拍 2–3 同屏,只有一个景——板载屏留空不画内容、掌名不进板图;
// 拍 3 是续拍(cover):场景不退出不重进,.cont 只让三条引出线出现、三部件依次高亮。
const CALLOUTS = [
  {d:0.9, x:217, y:92,  name:"摄像头", use:"将来拍错题"},
  {d:1.5, x:286, y:440, name:"A/B 键", use:"将来按出掌名和定义"},
  {d:2.1, x:304, y:265, name:"板载屏", use:"将来显示题目·掌名"},
];
const HW_SCENE = `
  <div class="num-big">02</div>
  <div class="kick r" style="--d:.15s">硬件示意</div>
  <div class="hw">
    <figure class="hw-fig r" style="--d:.4s;margin:0">
      <svg class="k10" viewBox="0 0 720 560" fill="none" role="img" aria-label="行空板 K10 正面简笔示意">
        <rect class="bd" x="40" y="24" width="320" height="510" rx="36"/>
        <g class="hl" style="--d:.9s"><circle class="part" cx="200" cy="92" r="17"/><circle class="dot" cx="200" cy="92" r="5.5"/></g>
        <g class="hl" style="--d:1.5s"><circle class="part" cx="140" cy="440" r="26"/><circle class="part" cx="260" cy="440" r="26"/><text class="bl" x="140" y="449" text-anchor="middle">A</text><text class="bl" x="260" y="449" text-anchor="middle">B</text></g>
        <g class="hl" style="--d:2.1s"><rect class="part scr" x="96" y="150" width="208" height="230" rx="12"/></g>
        ${CALLOUTS.map((c) => `<g class="co" style="--d:${c.d}s"><circle class="co-dot" cx="${c.x}" cy="${c.y}" r="5"/><path class="co-line" d="M${c.x} ${c.y} H368"/><text class="co-txt" x="384" y="${c.y + 9}">${c.name}<tspan class="u" dx="14">${c.use}</tspan></text></g>`).join("")}
      </svg>
      <figcaption class="k10-cap">行空板 K10</figcaption>
    </figure>
    <div class="hw-side">
      <h3 class="own-h r" style="--d:.5s">将由李赫愃用 Mind+ 积木制作</h3>
      <ul class="own-l">
        <li class="r" style="--d:.6s"><span class="no">①</span>按键拍照并在板载屏显示题目</li>
        <li class="r" style="--d:.7s"><span class="no">②</span>A/B 键分别显示见龙在田、潜龙勿用及她写的定义</li>
      </ul>
    </div>
  </div>`;
// 各拍正式画面按票补全;无正式画面的拍用骨架占位。cover = 该景兼作的续拍,不另生景。
const CONTENT = { 2: {html: HW_SCENE, cover: ["3"]} };
const COVERED = new Set(
  Object.values(CONTENT).flatMap((c) => (c.cover || []).map(Number)),
);
for (let b = 2; b < NB; b++) {
  if (COVERED.has(b)) continue;
  const segName = BEATS[b].seg == null ? "问辩附页" : SEGMENTS[BEATS[b].seg];
  const sec = document.createElement("section");
  sec.className = "sc";
  sec.dataset.beat = b;
  const C = CONTENT[b];
  if (C) {
    sec.innerHTML = C.html;
    if (C.cover) sec.dataset.cover = C.cover.join(" ");
  } else {
    sec.innerHTML = `${BEATS[b].seg == null ? "" : `<div class="num-big">0${BEATS[b].seg + 1}</div>`}
    <div class="kick r" style="--d:.2s">${segName}</div>
    <h2 class="ph-h r" style="--d:.4s">第 ${b} 拍</h2>
    <p class="ph-p r" style="--d:.7s">骨架占位 · 此拍画面在后续票补全</p>`;
  }
  main.appendChild(sec);
}
// 已立掌名单:见龙在田、潜龙勿用。导轨小条与十八掌位完整阵列共用这同一份数据;
// 其余十六位灰显「待立」,不预先写名称。
const PALMS = ["见龙在田", "潜龙勿用"];
document.querySelector(".mini18").innerHTML =
  Array.from({length: 18}, (_, i) =>
    i < PALMS.length ? `<i class="lit">${PALMS[i][0]}</i>` : "<i> </i>").join("");
// 十八掌位完整阵列:已立掌深蓝亮起,其余虚线灰显「待立」;--d 逐格落定。
// 使命开场与见题两拍共用,见题拍(#40+)填充时复用。
const fillP18 = (el, base) => {
  el.innerHTML = Array.from({length: 18}, (_, i) => {
    const d = `--d:${(base + i * 0.07).toFixed(2)}s`;
    return i < PALMS.length ? `<i class="lit" style="${d}">${PALMS[i]}</i>` : `<i style="${d}">待立</i>`;
  }).join("");
};
fillP18(document.getElementById("p18-1"), 0.9);
const scenes = [...document.querySelectorAll(".sc")];

const params = new URLSearchParams(location.search);
const clampBeat = (n) => Math.max(0, Math.min(NB - 1, Number.isFinite(n) ? n : 0));
let beat = clampBeat(parseInt(params.get("beat") || "0", 10));
const done = {}; // 作答拍落定状态,后续票在作答交互里写入

function gated() {
  const b = BEATS[beat];
  return !!(b.gate && !done[beat]);
}
function go(n) {
  beat = clampBeat(n);
  const B = BEATS[beat];
  stage.dataset.beat = beat;
  scenes.forEach((s) => {
    const cont = (s.dataset.cover || "").split(" ").includes(String(beat));
    s.classList.toggle("in", cont || +s.dataset.beat === beat);
    s.classList.toggle("cont", cont);
  });
  let pastCount = 0;
  segLis.forEach((li) => {
    const s = +li.dataset.seg;
    const past = beat > segLast[s];
    pastCount += past ? 1 : 0;
    li.classList.toggle("on", B.seg === s);
    li.classList.toggle("past", past);
  });
  // 进度线锚在轨顶下 20px:点亮段画到该段圆心,六段全过时画满整轨,导轨外拍(片头卡)为 0。
  prog.style.height = B.seg != null ? `${segLis[B.seg].offsetTop + 2}px`
    : pastCount === SEGMENTS.length ? `${railOl.clientHeight - 40}px` : "0px";
  tent.textContent = (B.tag ? B.tag + "\n" : "") + (B.tent || TENT_STD);
  notebar.textContent = B.note || "";
  try {
    const u = new URL(location.href);
    u.searchParams.set("beat", beat);
    history.replaceState(null, "", u);
  } catch (e) {}
}
function step(d) {
  if (d > 0 && gated()) return;
  go(beat + d);
}
addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea,select,[contenteditable]")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); step(-1); }
});
function fit() {
  scaler.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`;
}
addEventListener("resize", fit);
if (params.get("record") === "1") stage.dataset.record = "1";
fit();
go(beat);
</script>
</body>
</html>
